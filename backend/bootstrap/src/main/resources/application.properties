spring.application.name=lazystudio

# Desarrollo: Spring levanta el docker-compose.yml de la raíz del repo y no lo apaga al salir.
# La ruta es relativa a backend/bootstrap, donde corre ./mvnw -pl bootstrap spring-boot:run.
spring.docker.compose.file=../../docker-compose.yml
spring.docker.compose.lifecycle-management=start-only

# Esqueleto que camina: el chequeo de salud de Actuator (incluye PostgreSQL) en /api/salud, y nada más expuesto.
management.endpoints.web.base-path=/api
management.endpoints.web.path-mapping.health=salud
management.endpoints.web.exposure.include=health
# Orígenes de la app: Vite en desarrollo, y el webview de Tauri en Linux/Mac y en Windows. Valen para toda la API.
lazystudio.origenes=http://localhost:1420,tauri://localhost,http://tauri.localhost
management.endpoints.web.cors.allowed-origins=${lazystudio.origenes}
management.endpoints.web.cors.allowed-methods=GET
# Verificador SymPy (servicio "verificador" del docker-compose.yml). Si no responde, se corrige solo por texto.
lazystudio.verificador.url=http://localhost:${VERIFICADOR_PORT:8090}
